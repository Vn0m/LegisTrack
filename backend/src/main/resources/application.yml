server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: legistrack-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  data:
    redis:
      url: ${REDIS_URL}
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
      thread-name-prefix: async-

app:
  nysenate:
    baseUrl: https://legislation.nysenate.gov/api/3
    apiKey: ${NY_SENATE_API_KEY}
  huggingface:
    apiKey: ${HUGGINGFACE_API_KEY}
  supabase:
    url: ${SUPABASE_URL}
    jwtSecret: ${SUPABASE_JWT_SECRET:}
  aws:
    sqs-queue-url: ${SQS_QUEUE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
