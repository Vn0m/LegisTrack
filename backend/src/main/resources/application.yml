server:
  port: 8080

spring:
  application:
    name: legistrack-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      url: ${REDIS_URL}
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

app:
  nysenate:
    baseUrl: https://legislation.nysenate.gov/api/3/
    apiKey: ${NY_SENATE_API_KEY}
  huggingface:
    apiKey: ${HUGGINGFACE_API_KEY}
  supabase:
    url: ${SUPABASE_URL}
    serviceKey: ${SUPABASE_SERVICE_ROLE_KEY}
    # Only needed while the project's current signing key is the legacy HS256
    # shared secret. Once rotated to an asymmetric key, JWKS covers everything.
    jwtSecret: ${SUPABASE_JWT_SECRET:}
  aws:
    sqs-queue-url: ${SQS_QUEUE_URL}

logging:
  level:
    root: INFO

